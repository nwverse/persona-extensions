# Pull requests: scripts/ci.sh (manifests, gofmt, the copied SDK's vet and tests, vet, tests, every platform builds,
# both indexes agree).
# main: the same, then release the extensions whose version changed in the push, update both indexes and commit them.
# A manual run releases the extensions named (a version merged earlier and held back until now).
# Both jobs run on GitHub-hosted ubuntu-latest (a public repository: no self-hosted runner, no runner variable).
# When Actions can't run here, run scripts/ci.sh on your machine and say so in the pull request.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extensions:
        description: Extension ids to release, separated by spaces
        required: true
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci.sh
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # scripts/release.sh uses gh; ubuntu-latest has it. Should a runner not: a fixed release of GitHub's own,
      # checked against the sha256 written here, unpacked in the job's temporary directory (no sudo, nothing kept).
      - name: gh
        run: |
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          v=2.103.3
          case "$(uname -m)" in
            x86_64) arch=amd64 sum=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d ;;
            aarch64 | arm64) arch=arm64 sum=ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63 ;;
            *) echo "::error::no gh for $(uname -m)"; exit 1 ;;
          esac
          f="gh_${v}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/cli/cli/releases/download/v${v}/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin/gh" --version | head -1
      - name: Check and release
        env:
          BEFORE: ${{ github.event.before }}
          NAMED: ${{ inputs.extensions }}
        run: |
          if [ -n "$NAMED" ]; then
            read -ra named <<< "$NAMED"  # split on spaces, no glob expansion
            scripts/ci.sh release "${named[@]}"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            scripts/ci.sh
          else
            scripts/ci.sh release "$BEFORE"
          fi
      # The index's signature (nwverse/persona#1848): only with the market's key in the repository's secrets.
      # The key is given to this step only, not to the steps that run the extensions' code and tests.
      - name: Sign the index
        env:
          EXTENSION_MARKET_SIGNING_KEY: ${{ secrets.EXTENSION_MARKET_SIGNING_KEY }}
        run: |
          if [ -z "$EXTENSION_MARKET_SIGNING_KEY" ]; then echo "::warning::no EXTENSION_MARKET_SIGNING_KEY; index not signed"; exit 0; fi
          scripts/sign-index.py && scripts/sign-index.py verify
      # Staged first, so signatures that were not there before (an index whose entries were removed by hand, and its
      # stale .sig with them) are committed too.
      - name: Commit the index
        run: |
          for f in persona-extensions.json persona-plugins.json persona-extensions.json.sig persona-plugins.json.sig; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "market: index after ${GITHUB_SHA::7}"
          git push
