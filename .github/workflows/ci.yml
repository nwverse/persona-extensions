# Pull requests: scripts/ci.sh (manifests, gofmt, the copied SDK's vet and tests, vet, tests, every platform builds,
# both indexes agree).
# main: the same, then release the extensions whose version changed since the last commit a release run finished for
# (else since the push's "before"), update both indexes and commit them.
# A manual run releases the extensions named (a version merged earlier and held back until now).
# Both jobs run on GitHub-hosted ubuntu-latest (a public repository: no self-hosted runner, no runner variable).
# When Actions can't run here, run scripts/ci.sh on your machine and say so in the pull request.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extensions:
        description: Extension ids to release, separated by spaces
        required: true
permissions:
  contents: write
# A pull request's new push cancels its older run. A push to main is never cancelled here: its run gets a group of
# its own, and its release job waits in the release group below.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pluginkit/go.mod
          cache-dependency-path: "**/go.sum"
      - run: scripts/ci.sh
  release:
    if: github.event_name != 'pull_request'
    # One release at a time per branch, and a running one is never cancelled. GitHub still keeps only one waiting
    # run per group (a newer one replaces it), so a release diffs from the last commit CI released for, not only from
    # its own push's "before": the versions of a replaced run go out with the next one.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: pluginkit/go.mod
          cache-dependency-path: "**/go.sum"
      # scripts/release.sh uses gh; ubuntu-latest has it. Should a runner not: a fixed release of GitHub's own,
      # checked against the sha256 written here, unpacked in the job's temporary directory (no sudo, nothing kept).
      - name: gh
        run: |
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          v=2.103.3
          case "$(uname -m)" in
            x86_64) arch=amd64 sum=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d ;;
            aarch64 | arm64) arch=arm64 sum=ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63 ;;
            *) echo "::error::no gh for $(uname -m)"; exit 1 ;;
          esac
          f="gh_${v}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/cli/cli/releases/download/v${v}/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin/gh" --version | head -1
      - name: Check and release
        env:
          BEFORE: ${{ github.event.before }}
          NAMED: ${{ inputs.extensions }}
        run: |
          if [ -n "$NAMED" ]; then
            read -ra named <<< "$NAMED"  # split on spaces, no glob expansion
            scripts/ci.sh release "${named[@]}"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            scripts/ci.sh
          else
            # From the last commit CI released for, else this push's "before": a run dropped while it waited (GitHub
            # keeps one waiting run per group) released nothing, and its versions go out with this one.
            base=$(scripts/manifest.py base "$(scripts/manifest.py last-released)" "$BEFORE")
            echo "diffing from ${base:-$BEFORE}"
            scripts/ci.sh release "${base:-$BEFORE}"
          fi
      # The index's signature (nwverse/persona#1848): only with the market's key in the repository's secrets.
      # The key is given to this step only, not to the steps that run the extensions' code and tests.
      - name: Sign the index
        env:
          EXTENSION_MARKET_SIGNING_KEY: ${{ secrets.EXTENSION_MARKET_SIGNING_KEY }}
        run: |
          if [ -z "$EXTENSION_MARKET_SIGNING_KEY" ]; then echo "::warning::no EXTENSION_MARKET_SIGNING_KEY; index not signed"; exit 0; fi
          scripts/sign-index.py && scripts/sign-index.py verify
      # Staged first, so signatures that were not there before (an index whose entries were removed by hand, and its
      # stale .sig with them) are committed too.
      # Packaging takes long enough that another merge often lands on main meanwhile (runs 42076093722, 42078092272:
      # "fetch first"), so the commit is rebased onto the branch as it is now, a few times if it keeps moving. The index
      # files must come out of the rebase byte for byte as signed; a conflict (an index changed on main meanwhile) fails
      # the job, and a manual run for that id (scripts/ci.sh release <id>) then puts the released version in.
      - name: Commit the index
        env:
          BRANCH: ${{ github.ref_name }}
          NAMED: ${{ inputs.extensions }}
        run: |
          files="persona-extensions.json persona-plugins.json persona-extensions.json.sig persona-plugins.json.sig"
          for f in $files; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # "market: index after <sha>" marks what a push's release covered (scripts/manifest.py last-released); a
          # manual run released only the ids named, so its commit must not look like one.
          if [ -n "$NAMED" ]; then
            msg="market: index for $NAMED"  # a variable, so the input is not expanded again
            git commit -m "$msg"
          else
            git commit -m "market: index after ${GITHUB_SHA::7}"
          fi
          signed() { for f in $files; do echo "$f $(git rev-parse -q --verify "HEAD:$f" || echo none)"; done; }
          want=$(signed)
          for try in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::the index commit does not rebase onto origin/$BRANCH (the index changed there meanwhile)"
              exit 1
            fi
            if [ "$(signed)" != "$want" ]; then
              echo "::error::after the rebase the index files are not the ones signed"
              exit 1
            fi
            scripts/index.py check
            scripts/sign-index.py verify
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push $try rejected; main moved, rebasing again"
            sleep $((try * 5))
          done
          echo "::error::the index commit was not pushed after 5 tries"
          exit 1
