# Checks always run; publication stays disabled until the cleaned repository completes cutover.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [check, packages, catalog]
        description: Run checks only, push packages, or anonymously verify and sign a prior package plan
        default: check
        required: true
      mode:
        type: choice
        options: [bootstrap, versions]
        description: Bootstrap reuses the frozen cleaned Release archives; versions never creates Releases
        default: bootstrap
      package_run_id:
        description: Successful same-checkout-SHA package run (required for catalog phase)
        required: false
      confirm_cutover:
        type: boolean
        description: The cutover owner has confirmed completion (final repository name and id are also checked)
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  identity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: gate
        name: Require completed cutover before any publication
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm_cutover }}
          PHASE: ${{ inputs.phase }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PHASE" = check ]; then
            printf '%s\n' 'Checks-only dispatch: no publication or signing.'
            printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$CONFIRM" != true ]; then
              printf '%s\n' 'Publication requires explicit cutover confirmation.'
              exit 1
            fi
            python3 -I scripts/publish-oci.py gate --confirm-cutover
            printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_REPOSITORY" = nwverse/persona-extensions ] && [ "$GITHUB_REPOSITORY_ID" = 1449704212 ]; then
            python3 -I scripts/publish-oci.py gate --confirm-cutover
            printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'Cutover not enabled: checks only, no package publication.'
            printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"
          fi
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # PR continuity reads the actual base and signed source ancestry.
      - uses: actions/setup-go@v5
        with:
          go-version-file: pluginkit/go.mod
          cache-dependency-path: '**/go.sum'
      - run: scripts/ci.sh
        env:
          CATALOG_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  source-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_sources: ${{ steps.plan.outputs.has_sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I scripts/test-source-rebuild.py
      - id: plan
        run: python3 -I scripts/source-rebuild.py plan
  source-rebuild:
    name: Source standalone rebuild (${{ matrix.extension }})
    needs: [source-plan]
    if: needs.source-plan.outputs.has_sources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.source-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Rebuild isolated source and its standalone authoring archive
        env:
          SOURCE_EXTENSION: ${{ matrix.extension }}
        run: python3 -I scripts/source-rebuild.py rebuild --extension "$SOURCE_EXTENSION" --workspace "$RUNNER_TEMP/source-rebuild"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: source-rebuild-${{ matrix.extension }}
          path: ${{ runner.temp }}/source-rebuild/*.json
          if-no-files-found: error
  ci-required:
    name: CI required
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.phase == 'check')) }}
    needs: [check, source-plan, source-rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks and all registered source rebuilds
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SOURCE_PLAN_RESULT: ${{ needs.source-plan.result }}
          SOURCE_HAS_SOURCES: ${{ needs.source-plan.outputs.has_sources }}
          SOURCE_REBUILD_RESULT: ${{ needs.source-rebuild.result }}
        run: |
          if [ "$CHECK_RESULT" != success ] || [ "$SOURCE_PLAN_RESULT" != success ]; then
            printf 'Required checks did not succeed: check=%s source-plan=%s\n' "$CHECK_RESULT" "$SOURCE_PLAN_RESULT"
            exit 1
          fi
          if [ "$SOURCE_HAS_SOURCES" = true ]; then
            if [ "$SOURCE_REBUILD_RESULT" != success ]; then
              printf 'Required standalone source rebuild did not succeed: %s\n' "$SOURCE_REBUILD_RESULT"
              exit 1
            fi
          elif [ "$SOURCE_HAS_SOURCES" != false ] || [ "$SOURCE_REBUILD_RESULT" != skipped ]; then
            printf '%s\n' 'Invalid source rebuild selection or result.'
            exit 1
          fi
  packages:
    needs: [identity, check]
    if: needs.identity.outputs.publish == 'true' && (github.event_name == 'push' || inputs.phase == 'packages')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Global across trusted refs; no concurrent tag writers and no cancellation mid-upload.
    concurrency:
      group: persona-extension-oci-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: pluginkit/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Push once or verify and reuse existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'push' && 'versions' || inputs.mode }}
        run: python3 -I scripts/publish-oci.py push --confirm-cutover --mode "$MODE" --output "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true # Reruns share the run id; replace the partial plan.
          name: oci-package-plan
          path: |
            ${{ runner.temp }}/packages/plan.json
            ${{ runner.temp }}/packages/package-settings.json
          if-no-files-found: error
          retention-days: 30
  anonymous:
    needs: [identity, check]
    if: needs.identity.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.phase == 'catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: python3 -I scripts/publish-oci.py validate-run --confirm-cutover --run-id "$PACKAGE_RUN_ID"
      - name: Require a new empty artifact directory
        run: mkdir "$RUNNER_TEMP/package-plan"
      - uses: actions/download-artifact@v4
        with:
          name: oci-package-plan
          path: ${{ runner.temp }}/package-plan
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Anonymous public gate and payload generation
        env:
          GH_TOKEN: ${{ github.token }} # GitHub identity check only; registry clients are explicitly anonymous.
        run: python3 -I scripts/publish-oci.py catalog --confirm-cutover --plan "$RUNNER_TEMP/package-plan/plan.json" --output "$RUNNER_TEMP/unsigned"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: verified-unsigned-payload
          path: ${{ runner.temp }}/unsigned/payload.json
          if-no-files-found: error
  sign:
    needs: [anonymous]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a new empty artifact directory
        run: mkdir "$RUNNER_TEMP/unsigned"
      - uses: actions/download-artifact@v4
        with:
          name: verified-unsigned-payload
          path: ${{ runner.temp }}/unsigned
      # No build/test/untrusted extension code in this job. The secret belongs only to this step.
      - name: Sign raw payload with the approved existing key
        env:
          EXTENSION_MARKET_SIGNING_KEY: ${{ secrets.EXTENSION_MARKET_SIGNING_KEY }}
        run: |
          mkdir "$RUNNER_TEMP/signed"
          python3 -I scripts/sign-index.py sign --payload "$RUNNER_TEMP/unsigned/payload.json" --output "$RUNNER_TEMP/signed/persona-extensions.json" --source-commit "$GITHUB_SHA"
          python3 -I scripts/sign-index.py verify --catalog "$RUNNER_TEMP/signed/persona-extensions.json"
          printf '%s\n' 'Catalog artifact only: create or reuse a dedicated catalog-update issue before opening its PR. Put Refs #<catalog-issue-number> in that PR body; #146 is code tracking only. Require the PR own CI; never push the catalog directly to main.' > "$RUNNER_TEMP/signed/PR-body.txt"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: signed-oci-catalog
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 30
