# Pull requests: scripts/ci.sh (manifests, gofmt, vet, tests, every platform builds, both indexes agree).
# main: the same, then release the extensions whose version changed in the push, update both indexes and commit them.
# A manual run releases the extensions named (a version merged earlier and held back until now).
# When Actions can't run here, run scripts/ci.sh on your machine and say so in the pull request.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extensions:
        description: Extension ids to release, separated by spaces
        required: true
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci.sh
  release:
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check and release
        env:
          BEFORE: ${{ github.event.before }}
          NAMED: ${{ inputs.extensions }}
        run: |
          if [ -n "$NAMED" ]; then
            scripts/ci.sh release $NAMED
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            scripts/ci.sh
          else
            scripts/ci.sh release "$BEFORE"
          fi
      # The index's signature (nwverse/persona#1848): only with the market's key in the repository's secrets.
      # The key is given to this step only, not to the steps that run the extensions' code and tests.
      - name: Sign the index
        env:
          EXTENSION_MARKET_SIGNING_KEY: ${{ secrets.EXTENSION_MARKET_SIGNING_KEY }}
        run: |
          if [ -z "$EXTENSION_MARKET_SIGNING_KEY" ]; then echo "::warning::no EXTENSION_MARKET_SIGNING_KEY; index not signed"; exit 0; fi
          scripts/sign-index.py && scripts/sign-index.py verify
      - name: Commit the index
        run: |
          if git diff --quiet -- persona-extensions.json persona-plugins.json persona-extensions.json.sig persona-plugins.json.sig; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persona-extensions.json persona-plugins.json
          git add persona-extensions.json.sig persona-plugins.json.sig
          git commit -m "market: index after ${GITHUB_SHA::7}"
          git push
